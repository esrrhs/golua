name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build & Test (${{ matrix.os }}, ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 'oldstable' keeps the package building on the previous release;
        # go.mod requires 1.24, so anything older cannot compile it.
        go-version: ['oldstable', 'stable']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache: false

      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "not gofmt-clean:"; echo "$out"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test ./...

      # The race detector needs cgo, so it runs on Linux and macOS only.
      - name: Test with the race detector
        if: runner.os != 'Windows'
        run: go test -race ./...

      # The benchmarks are compiled and run once (very short) so that a
      # broken benchmark does not rot unnoticed.
      - name: Benchmarks compile and run
        if: runner.os == 'Linux'
        run: go test -run=XXX -bench=. -benchtime=1x ./...

  # Everything above runs with cgo, which is the default.  Without cgo
  # the package must still build and pass: it loses only the loading of
  # shared objects (see README §5.3), and it is the configuration that
  # cross-compiles.  This job is what keeps that promise true.
  nocgo:
    name: Pure Go, no cgo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache: false

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # A cross-compile is the other thing cgo takes away.  Build for
      # every target this package claims, without any toolchain but Go's.
      - name: Cross-compile
        shell: bash
        run: |
          set -e
          for target in windows/amd64 windows/arm64 darwin/arm64 linux/arm64 linux/386; do
            GOOS=${target%/*} GOARCH=${target#*/} go build ./...
            echo "  ok  $target"
          done

  # The two suites that answer to PUC-Lua itself: Lua's own, in
  # testdata/official, and this port's own, in testdata/diff -- see
  # official_test.go and diff_test.go.  Both compare against a
  # reference interpreter built from source on the runner.
  #
  # Neither can work from goldens alone: a good many of these answers
  # belong to the machine and not to Lua -- 'os.date' asks the C
  # library, and the NaN that 0/0 produces carries the sign the CPU gave
  # it, so 'nan' here is '-nan' there.  The goldens in the repository
  # are darwin, and a platform that has none skips; LUA_REF captures
  # fresh ones seconds before they are compared, which is what makes
  # every run here a real differential one and keeps the committed
  # goldens from rotting unnoticed.
  #
  # (No Windows: Lua's own makefile is a Unix makefile.)
  official:
    name: PUC-Lua suites (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache: false

      - name: Build the reference interpreter
        shell: bash
        run: |
          set -e
          curl -sSfL -o lua-5.4.9.tar.gz https://www.lua.org/ftp/lua-5.4.9.tar.gz
          tar zxf lua-5.4.9.tar.gz
          # 'posix' on purpose, and not the platform's own target: it is
          # the one build that is the same everywhere, and it leaves
          # readline out.  Which matters -- with readline the reference
          # prints no REPL prompt at all when its input is a pipe, and
          # main.lua tests the prompt.  dlopen has to be asked for, and
          # on Linux the executable has to export lua_* (-Wl,-E) for the
          # C libraries of libs/ to resolve; without it the reference
          # itself answers "error loading module 'lib2-v2'" and the half
          # of main.lua and attrib.lua that is about C libraries is
          # compared against a shrug.  macOS exports them anyway and its
          # linker has no -E, hence the empty SYSLIBS.
          if [ "$RUNNER_OS" = "macOS" ]; then
            make -C lua-5.4.9 -j4 posix SYSLIBS= MYCFLAGS=-DLUA_USE_DLOPEN
          else
            make -C lua-5.4.9 -j4 posix MYCFLAGS=-DLUA_USE_DLOPEN SYSLIBS="-Wl,-E"
          fi
          ./lua-5.4.9/src/lua -v

      - name: Official suite
        shell: bash
        env:
          LUA_REF: ${{ github.workspace }}/lua-5.4.9/src/lua
        run: go test -v -run TestOfficialSuite -timeout 20m .

      - name: Differential suite
        shell: bash
        env:
          LUA_REF: ${{ github.workspace }}/lua-5.4.9/src/lua
        run: go test -v -run TestDifferentialSuite -timeout 20m .

      # The same comparison without cases anybody wrote: 37 816
      # expressions and snippets built in the test and answered by both
      # interpreters (fuzz_test.go); 174 775 pattern/subject pairs,
      # 1 048 650 answers (patternfuzz_test.go); 11 340 format strings
      # against 22 values plus a missing one, 260 820 answers
      # (formatfuzz_test.go); and 1 834 strings read plus 49 written,
      # 11 053 answers (numfuzz_test.go).  All four need LUA_REF for
      # the same reason the suite above does, so they have to run here
      # and nowhere else.
      - name: Differential fuzz
        shell: bash
        env:
          LUA_REF: ${{ github.workspace }}/lua-5.4.9/src/lua
        run: go test -v -run 'TestFuzzDifferential|TestPatternFuzzDifferential|TestFormatFuzzDifferential|TestNumberFuzzDifferential|TestCoroutineFuzzDifferential|TestForFuzzDifferential|TestCodegenFuzzDifferential|TestIOFuzzDifferential' -timeout 30m .
